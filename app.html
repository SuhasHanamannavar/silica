<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silica — Workspace</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=2.1">
</head>
<body>
<div class="app">
  <!-- ============ Sidebar ============ -->
  <aside class="sidebar">
    <a class="brand" href="index.html" title="Silica home" style="display:flex;align-items:center;padding:10px 12px">
      <img src="assets/silica_teddy_logo.png" alt="Silica" style="height:34px;width:auto;object-fit:contain;display:block">
    </a>
    <nav class="nav" id="nav">
      <div class="group-label">Work</div>
      <button class="nav-item active" data-view="workspace">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Workspace
      </button>
      <button class="nav-item" data-view="new">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New Design
      </button>
      <button class="nav-item" data-view="run">
        <svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
        Active Run
        <span class="count" id="nav-run-count">—</span>
      </button>
      <button class="nav-item" data-view="architect">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 7h18M3 17h18"/><circle cx="12" cy="12" r="2"/></svg>
        Product Architect
        <span class="count" id="nav-arch-count" style="background:rgba(148,163,184,0.12);color:#94A3B8;border:1px solid rgba(148,163,184,0.25);font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px">NV-ARCH</span>
      </button>
      <a class="nav-item" href="chat.html" style="text-decoration:none">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        AI Chat
        <span class="count" style="background:rgba(251,191,36,0.12);color:#FBBF24;border:1px solid rgba(251,191,36,0.25);font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px">SOON</span>
      </a>
      <div class="group-label">History</div>
      <button class="nav-item" data-view="history">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Past Runs
        <span class="count" id="nav-hist-count">2</span>
      </button>
      <button class="nav-item" data-view="artifacts">
        <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
        Artifacts
      </button>
      <div class="group-label">Account</div>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.4 1z"/></svg>
        Settings
      </button>
    </nav>
    <div class="side-foot">
      <div class="user" id="app-user-box" title="Click to Sign Out / Switch Account" style="cursor:pointer">
        <div class="avatar" id="app-avatar">A</div>
        <div>
          <div class="u-name" id="app-uname">Engineer</div>
          <div class="u-mail" id="app-umail">engineer@company.com</div>
        </div>
      </div>
    </div>
  </aside>
  <script>
    (function(){
      try {
        var email = localStorage.getItem('silica_user');
        var name = localStorage.getItem('silica_name');
        if(email){
          var dn = name || email.split('@')[0];
          var av = dn.trim().charAt(0).toUpperCase() || 'E';
          var uN = document.getElementById('app-uname');
          var uM = document.getElementById('app-umail');
          var aV = document.getElementById('app-avatar');
          if(uN) uN.textContent = dn;
          if(uM) uM.textContent = email;
          if(aV) aV.textContent = av;
        }
      }catch(e){}
    })();
  </script>

  <!-- ============ Main ============ -->
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"><span>Silica</span><span class="sep">/</span><span class="cur" id="crumb-cur">Workspace</span></div>
      <div class="spacer"></div>
      <div class="run-pill" id="run-pill"><span class="d"></span><span id="run-pill-text">No active run</span></div>
      <button class="btn sm" id="top-new">+ New Design</button>
    </header>
    <div class="view" id="view"><div class="view-inner" id="view-inner"></div></div>
  </div>
</div>

<div class="toast" id="toast"><div class="t-t" id="toast-t">Notice</div><div id="toast-b"></div></div>

<script src="data/transcript.js"></script>
<script src="app.js?v=2.2"></script>
</body>
</html>
