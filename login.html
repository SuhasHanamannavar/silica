<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silica — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <!-- Background Canvas -->
  <div class="login-canvas-bg">
    <canvas id="bg-canvas"></canvas>
  </div>

  <!-- Back link -->
  <a href="index.html" class="login-back">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Back to Silica
  </a>

  <!-- Login Card -->
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <span class="logo-mark">S</span>
        <span>Silica</span>
      </div>
      <h1 class="login-title">Sign in</h1>
      <p class="login-subtitle">Welcome back. Continue your design session.</p>
    </div>

    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@company.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div class="form-options">
        <label class="form-checkbox">
          <input type="checkbox" id="remember" checked>
          Remember me
        </label>
        <a href="#" class="form-link" onclick="return showForgotPassword()">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary btn-full">
        Sign in
      </button>
    </form>

    <div class="login-divider"><span>or</span></div>

    <p class="login-footer">
      Don't have an account? <a href="#">Contact sales</a>
    </p>
  </div>

  <script>
    // --- Background particle system for login page ---
    (function() {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let cw, ch, cdpr;
      let animTime = 0;
      let lastTime = performance.now();
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        cdpr = Math.min(window.devicePixelRatio || 1, 2);
        cw = window.innerWidth;
        ch = window.innerHeight;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        canvas.width = cw * cdpr;
        canvas.height = ch * cdpr;
        ctx.setTransform(cdpr, 0, 0, cdpr, 0, 0);
      }

      class Particle {
        constructor() { this.reset(true); }
        reset(initial) {
          this.x = Math.random() * cw;
          this.y = Math.random() * ch;
          this.size = Math.random() * 1.2 + 0.3;
          this.baseAlpha = Math.random() * 0.35 + 0.08;
          this.alpha = this.baseAlpha;
          this.speedX = (Math.random() - 0.5) * 0.12;
          this.speedY = (Math.random() - 0.5) * 0.08 - 0.04;
          this.pulseSpeed = Math.random() * 0.015 + 0.004;
          this.pulseOffset = Math.random() * Math.PI * 2;
          this.tint = Math.random() > 0.88 ? 'pink' : 'white';
        }
        update(dt) {
          this.x += this.speedX * dt;
          this.y += this.speedY * dt;
          this.alpha = this.baseAlpha * (0.6 + 0.4 * Math.sin(animTime * this.pulseSpeed + this.pulseOffset));
          if (this.x < -10) this.x = cw + 10;
          if (this.x > cw + 10) this.x = -10;
          if (this.y < -10) this.y = ch + 10;
          if (this.y > ch + 10) this.y = -10;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          if (this.tint === 'pink') {
            ctx.fillStyle = `rgba(245, 198, 208, ${this.alpha * 0.7})`;
          } else {
            ctx.fillStyle = `rgba(255, 245, 240, ${this.alpha})`;
          }
          ctx.fill();
        }
      }

      resize();
      const count = Math.min(100, Math.floor((cw * ch) / 18000));
      const particles = [];
      for (let i = 0; i < count; i++) particles.push(new Particle());

      window.addEventListener('resize', () => {
        resize();
        const newCount = Math.min(100, Math.floor((cw * ch) / 18000));
        while (particles.length < newCount) particles.push(new Particle());
        while (particles.length > newCount) particles.pop();
      });

      function render() {
        const now = performance.now();
        const dt = Math.min(32, now - lastTime);
        lastTime = now;
        animTime += dt;
        ctx.clearRect(0, 0, cw, ch);
        particles.forEach(p => {
          if (!prefersReducedMotion) p.update(dt * 0.06);
          p.draw();
        });
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();

    // --- Authentication handlers ---
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      
      const btn = event.target.querySelector('button[type="submit"]');
      const originalText = btn.textContent;
      btn.textContent = 'Signing in...';
      btn.disabled = true;

      // Attempt real API call first, fall back to client-side auth
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, remember })
      }).then(r => {
        if (r.ok) return r.json();
        throw new Error('API unavailable');
      }).then(data => {
        if (data.token) {
          localStorage.setItem('silica_token', data.token);
          localStorage.setItem('silica_user', email);
          window.location.href = 'index.html';
        } else {
          showLoginError('Invalid credentials');
        }
      }).catch(() => {
        // Client-side fallback auth
        setTimeout(() => {
          if (email && password.length >= 4) {
            localStorage.setItem('silica_user', email);
            localStorage.setItem('silica_session', Date.now());
            window.location.href = 'index.html';
          } else {
            showLoginError('Please enter a valid email and password');
          }
        }, 600);
      }).finally(() => {
        btn.textContent = originalText;
        btn.disabled = false;
      });

      return false;
    }

    function showLoginError(message) {
      const form = document.getElementById('login-form');
      let errorEl = form.querySelector('.login-error');
      if (!errorEl) {
        errorEl = document.createElement('div');
        errorEl.className = 'login-error';
        errorEl.style.cssText = 'font-family:Inter,sans-serif;font-size:13px;color:rgba(232,100,100,0.85);text-align:center;margin-bottom:16px;padding:10px;background:rgba(100,20,30,0.15);border:1px solid rgba(232,100,100,0.2);border-radius:8px;';
        form.insertBefore(errorEl, form.querySelector('.form-options'));
      }
      errorEl.textContent = message;
      setTimeout(() => { if (errorEl.parentNode) errorEl.remove(); }, 4000);
    }

    function showForgotPassword() {
      alert('Password reset is not available in this demo. Please contact your system administrator.');
      return false;
    }

    // Check if already logged in
    if (localStorage.getItem('silica_token') || localStorage.getItem('silica_session')) {
      // Don't auto-redirect, let user sign out if needed
    }
  </script>
</body>
</html>
