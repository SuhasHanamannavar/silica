<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SILICA — Access & Account Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090d;
      --bg-card: #0d0f17;
      --bg-input: #121520;
      --ink: #f0f4f8;
      --ink-dim: #94a3b8;
      --ink-faint: #475569;
      --line: rgba(148, 163, 184, 0.14);
      --line-strong: rgba(148, 163, 184, 0.28);
      --blue: #5b8bf7;
      --blue-bright: #6896ff;
      --blue-glow: rgba(91, 139, 247, 0.4);
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: 'B612 Mono', ui-monospace, Menlo, monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient blue glow behind card */
    .glow {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 650px; height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(91, 139, 247, 0.12) 0%, rgba(91, 139, 247, 0.03) 45%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Back link */
    .back-nav {
      position: fixed;
      top: 28px; left: 36px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      transition: color 0.2s;
    }
    .back-nav:hover { color: var(--blue-bright); }

    /* Telemetry badge */
    .db-badge {
      position: fixed;
      top: 28px; right: 36px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--blue-bright);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(91, 139, 247, 0.08);
      border: 1px solid rgba(91, 139, 247, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 10;
    }
    .db-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Card */
    .auth-card {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 38px 36px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(91, 139, 247, 0.08);
    }

    /* Header */
    .auth-header { text-align: center; margin-bottom: 28px; }
    .logo-mark {
      display: inline-flex;
      align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border: 1.5px solid var(--blue);
      border-radius: 6px;
      color: var(--blue-bright);
      font-family: var(--mono);
      font-weight: 700;
      font-size: 14px;
      background: rgba(91, 139, 247, 0.1);
      margin-bottom: 14px;
    }
    .auth-title { font-size: 24px; font-weight: 600; color: #fff; letter-spacing: -0.02em; }
    .auth-subtitle { color: var(--ink-dim); font-size: 13px; margin-top: 6px; }

    /* Tabs */
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin-bottom: 26px;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 0;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
      cursor: pointer;
      transition: all 0.25s;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active {
      color: var(--blue-bright);
      border-bottom-color: var(--blue);
      font-weight: 600;
    }

    /* Form Fields */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 7px;
    }
    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--line);
      color: #fff;
      font-family: var(--sans);
      font-size: 14px;
      padding: 11px 14px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(91, 139, 247, 0.2);
    }
    .form-input::placeholder { color: var(--ink-faint); }

    /* Options */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--ink-dim);
      margin-bottom: 22px;
    }
    .form-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .form-checkbox input { accent-color: var(--blue); }
    .form-link { color: var(--blue-bright); text-decoration: none; font-size: 12px; }
    .form-link:hover { text-decoration: underline; }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(91, 139, 247, 0.35);
      transition: all 0.25s;
    }
    .btn-submit:hover {
      background: var(--blue-bright);
      box-shadow: 0 0 25px rgba(91, 139, 247, 0.55);
      transform: translateY(-1px);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Alerts */
    .auth-alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 18px;
      display: none;
      line-height: 1.5;
    }
    .auth-alert.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .auth-alert.success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    /* Footer hints */
    .auth-hints {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-faint);
      line-height: 1.6;
      text-align: center;
    }
    .auth-hints code {
      color: var(--ink-dim);
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <!-- Top bar -->
  <a href="index.html" class="back-nav">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Back to Silica
  </a>

  <div class="db-badge">
    <span class="db-dot"></span>
    AWS DynamoDB Live (ap-south-1)
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-mark">2</div>
      <h1 class="auth-title" id="card-title">Sign In</h1>
      <p class="auth-subtitle" id="card-subtitle">Access your autonomous EDA engineering session</p>
    </div>

    <!-- Tab Switcher -->
    <div class="auth-tabs">
      <button class="tab-btn active" id="tab-login" onclick="setMode('login')">Sign In</button>
      <button class="tab-btn" id="tab-signup" onclick="setMode('signup')">Create Account</button>
    </div>

    <div id="alert-box" class="auth-alert"></div>

    <!-- Sign In Form -->
    <form id="form-login" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="login-email">Engineer Email</label>
        <input type="email" id="login-email" class="form-input" placeholder="webofjee@gmail.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div class="form-options">
        <label class="form-checkbox">
          <input type="checkbox" id="remember" checked>
          Keep session active
        </label>
        <a href="#" class="form-link" onclick="quickFillAdmin(); return false;">Use Seeded Admin</a>
      </div>

      <button type="submit" class="btn-submit" id="btn-login-submit">Sign In →</button>
    </form>

    <!-- Sign Up Form (hidden by default) -->
    <form id="form-signup" style="display:none;" onsubmit="return handleSignup(event)">
      <div class="form-group">
        <label class="form-label" for="signup-name">Full Name</label>
        <input type="text" id="signup-name" class="form-input" placeholder="Suhas Hanamannavar" required autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-email">Work Email</label>
        <input type="email" id="signup-email" class="form-input" placeholder="engineer@foundry.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-password">Password</label>
        <input type="password" id="signup-password" class="form-input" placeholder="•••••••• (min 4 characters)" minlength="4" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-company">Organization / Foundry (Optional)</label>
        <input type="text" id="signup-company" class="form-input" placeholder="VLSI Systems / TSMC / Intel">
      </div>

      <button type="submit" class="btn-submit" id="btn-signup-submit">Register in AWS DynamoDB →</button>
    </form>

    <div class="auth-hints">
      Database: AWS DynamoDB table <code>silica-users</code><br>
      Default Admin: <code>webofjee@gmail.com</code> / <code>Suhas@2007</code>
    </div>
  </div>

  <script>
    function setMode(mode) {
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const formLogin = document.getElementById('form-login');
      const formSignup = document.getElementById('form-signup');
      const cardTitle = document.getElementById('card-title');
      const cardSubtitle = document.getElementById('card-subtitle');
      const alertBox = document.getElementById('alert-box');
      alertBox.style.display = 'none';

      if (mode === 'signup') {
        tabLogin.classList.remove('active');
        tabSignup.classList.add('active');
        formLogin.style.display = 'none';
        formSignup.style.display = 'block';
        cardTitle.textContent = 'Create Account';
        cardSubtitle.textContent = 'Register an engineer profile in AWS DynamoDB';
      } else {
        tabSignup.classList.remove('active');
        tabLogin.classList.add('active');
        formSignup.style.display = 'none';
        formLogin.style.display = 'block';
        cardTitle.textContent = 'Sign In';
        cardSubtitle.textContent = 'Access your autonomous EDA engineering session';
      }
    }

    // Check URL param ?mode=signup
    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') === 'signup') {
      setMode('signup');
    }

    function showAlert(msg, isError) {
      const box = document.getElementById('alert-box');
      box.textContent = msg;
      box.className = 'auth-alert ' + (isError ? 'error' : 'success');
      box.style.display = 'block';
    }

    function quickFillAdmin() {
      document.getElementById('login-email').value = 'webofjee@gmail.com';
      document.getElementById('login-password').value = 'Suhas@2007';
      showAlert('Filled seeded admin credentials from AWS DynamoDB. Click Sign In.', false);
    }

    // Sign In Handler
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');

      btn.textContent = 'Authenticating with AWS...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('silica_token', data.token);
          localStorage.setItem('silica_user', data.email || email);
          localStorage.setItem('silica_name', data.name || 'Engineer');
          showAlert('Authentication verified! Redirecting to EDA Workspace...', false);
          setTimeout(() => { window.location.href = 'app.html'; }, 700);
        } else {
          showAlert(data.error || 'Invalid email or password.', true);
        }
      } catch (err) {
        showAlert('Network or API error: ' + err.message, true);
      } finally {
        btn.textContent = 'Sign In →';
        btn.disabled = false;
      }
    }

    // Sign Up Handler
    async function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const company = document.getElementById('signup-company').value.trim();
      const btn = document.getElementById('btn-signup-submit');

      btn.textContent = 'Saving to AWS DynamoDB...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, company })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('silica_token', data.token);
          localStorage.setItem('silica_user', email);
          localStorage.setItem('silica_name', name);
          showAlert('Account saved to AWS DynamoDB successfully! Launching workspace...', false);
          setTimeout(() => { window.location.href = 'app.html'; }, 900);
        } else {
          showAlert(data.error || 'Failed to create account.', true);
        }
      } catch (err) {
        showAlert('Registration error: ' + err.message, true);
      } finally {
        btn.textContent = 'Register in AWS DynamoDB →';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
