<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silica — AI Engineering Chat</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-light: #F5F5F7;
    --bg-white: #FFFFFF;
    --bg-surface: #FAFAFA;
    --ink-black: #000000;
    --ink-primary: #111111;
    --ink-secondary: #666666;
    --ink-muted: #999999;
    --line: rgba(0, 0, 0, 0.08);
    --line-strong: rgba(0, 0, 0, 0.14);
    --accent: #0F766E;
    --accent-hover: #0D655E;
    --accent-soft: rgba(15, 118, 110, 0.08);
    --success: #16A34A;
    --fail: #DC2626;
    --warn: #D97706;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background: var(--bg-light);
    color: var(--ink-primary);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header{
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-white);
  }
  header .logo{
    font-weight: 600;
    letter-spacing: -0.01em;
    font-size: 16px;
    color: var(--ink-black);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .logo svg{ color: var(--accent); }
  header .divider{
    width: 1px;
    height: 20px;
    background: var(--line);
    margin: 0 4px;
  }
  header .title{
    font-size: 14px;
    color: var(--ink-secondary);
  }
  header .badge{
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 20px;
    color: var(--ink-muted);
    background: var(--bg-surface);
  }
  header .badge.live{
    color: var(--success);
    border-color: rgba(22, 163, 74, 0.25);
    background: rgba(22, 163, 74, 0.06);
  }
  header .badge.warn{
    color: var(--warn);
    border-color: rgba(217, 119, 6, 0.25);
    background: rgba(217, 119, 6, 0.06);
  }
  header .badge.fail{
    color: var(--fail);
    border-color: rgba(220, 38, 38, 0.25);
    background: rgba(220, 38, 38, 0.06);
  }
  header .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-secondary);
    text-decoration: none;
    margin-right: 12px;
    transition: color 0.2s;
  }
  header .back-link:hover{ color: var(--accent); }

  #chat{
    flex: 1;
    overflow-y: auto;
    padding: 32px 24px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  .msg{
    margin-bottom: 18px;
    padding: 14px 18px;
    border-radius: var(--radius-md);
    max-width: 92%;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user{
    background: var(--accent);
    color: #fff;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .assistant{
    background: var(--bg-white);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .stage{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 13px;
    color: var(--ink-secondary);
  }
  .stage .dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-muted);
    flex: none;
  }
  .stage.passed .dot{ background: var(--success); }
  .stage.failed .dot{ background: var(--fail); }
  .stage.running .dot{
    background: var(--warn);
    animation: pulse 1s infinite;
  }
  @keyframes pulse{ 50%{ opacity: 0.3; } }

  pre{
    background: #0D1117;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 12px;
    margin-top: 10px;
    color: #C9D1D9;
    font-family: var(--mono);
    line-height: 1.6;
  }

  .composer{
    border-top: 1px solid var(--line);
    padding: 18px 24px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: var(--bg-white);
  }
  textarea{
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    color: var(--ink-primary);
    padding: 12px 14px;
    font-size: 14px;
    resize: none;
    min-height: 56px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    line-height: 1.5;
  }
  textarea:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button{
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    padding: 0 22px;
    font-weight: 500;
    cursor: pointer;
    font-size: 14px;
    font-family: var(--sans);
    transition: background 0.2s;
  }
  button:hover{ background: var(--accent-hover); }
  button:disabled{ opacity: 0.5; cursor: not-allowed; }

  .meta{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 8px;
  }
  a{ color: var(--accent); }

  ::-webkit-scrollbar{ width: 10px; height: 10px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{
    background: rgba(0, 0, 0, 0.15);
    border-radius: 5px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
</style>
</head>
<body>
<header>
  <a href="app.html" class="back-link">
    <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
      <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Workspace
  </a>
  <div class="logo">
    <svg viewBox="0 0 32 32" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="26" height="26" rx="6"/>
      <path d="M10 11.5 H21 V16 H11 V20.5 H22.5" stroke-width="2.4"/>
    </svg>
    SILICA
  </div>
  <div class="divider"></div>
  <div class="title">AI Semiconductor Engineering</div>
  <div class="badge" id="badge">connecting…</div>
</header>

<div id="chat"></div>

<div class="composer">
  <textarea id="prompt" placeholder="Describe the chip you want to build, e.g. 'Design a 4-bit up-counter with clock enable and overflow flag.'"></textarea>
  <button id="send">Run</button>
</div>

<script>
// ---- Auth: attach token to every fetch, redirect to /login on 401 ----
(function(){
  const _of = window.fetch.bind(window);
  window.fetch = function(url, opts){
    opts = opts || {}; opts.headers = opts.headers || {};
    const t = localStorage.getItem('silica_token');
    if(t) opts.headers['Authorization'] = 'Bearer ' + t;
    return _of(url, opts).then(function(r){
      if(r.status === 401){ location.href = '/login'; }
      return r;
    });
  };
  if(!localStorage.getItem('silica_token') && !location.pathname.startsWith('/login')){
    location.href = '/login';
  }
})();

const $ = s => document.querySelector(s);

fetch('/api/health').then(r => r.json()).then(d => {
  const badge = $('#badge');
  badge.textContent = d.tools_available ? 'LIVE EDA BACKEND' : 'frontend-only';
  badge.className = 'badge ' + (d.tools_available ? 'live' : 'warn');
}).catch(() => {
  const badge = $('#badge');
  badge.textContent = 'backend offline';
  badge.className = 'badge fail';
});

function addMsg(role, html){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = html;
  $('#chat').appendChild(d);
  $('#chat').scrollTop = 1e9;
  return d;
}

$('#send').onclick = async () => {
  const p = $('#prompt').value.trim();
  if(!p) return;
  $('#send').disabled = true;
  addMsg('user', p);
  $('#prompt').value = '';
  const status = addMsg('assistant', '<div class="stage running"><span class="dot"></span>dispatching to orchestrator…</div>');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt: p})
    });
    const j = await r.json();
    if(j.error){
      status.innerHTML = '<span style="color:var(--fail)">Error: ' + j.error + '</span>';
      $('#send').disabled = false;
      return;
    }
    const cid = j.chat_id;
    let last = '';
    const iv = setInterval(async () => {
      const s = await fetch('/api/chat/' + cid).then(x => x.json());
      const html = (s.stages || []).map(st =>
        '<div class="stage ' + st.status + '"><span class="dot"></span>' +
        st.name + (st.actions ? ' — ' + st.actions.join('; ') : '') + '</div>'
      ).join('');
      const summary = '<div class="meta">model: ' + (s.model || '—') +
        ' · source: ' + (s.source || '—') +
        (s.blocker ? ' · <span style="color:var(--fail)">blocker: ' + s.blocker + '</span>' : '') +
        '</div>';
      if(html !== last){
        status.innerHTML = html + summary;
        last = html;
        $('#chat').scrollTop = 1e9;
      }
      if(s.status !== 'running'){
        clearInterval(iv);
        $('#send').disabled = false;
        if(s.report){
          addMsg('assistant',
            '<b>Engineering report</b>\n' +
            'Disposition: ' + s.report.disposition + '\n' +
            'Missing signoff checks: ' + s.report.missing_signoff_checks.join(', ') + '\n' +
            'Artifacts: ' + (s.artifacts || []).join(', ')
          );
        }
      }
    }, 1500);
  } catch(e){
    status.innerHTML = '<span style="color:var(--fail)">Request failed: ' + e + ' — is server.py running locally?</span>';
    $('#send').disabled = false;
  }
};

$('#prompt').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    $('#send').click();
  }
});
</script>
</body>
</html>
